name: luck5
description: NegativeTag skip reward + OopsAll6s shop cluster scenario across Antes 2 (Max) and 3 (Sum)
author: pifreak & their pal Cursor AI
deck: Anaglyph
stake: White

must:
  - legendaryJoker: Perkeo
    antes: [1, 2, 3, 4, 5, 6, 7, 8]

should:
  - legendaryJoker: Perkeo
    score: 10

  # Ante 2 - Score based on NegativeTag Skip Reward + Desired jokers in shop cluster
  - and:
      - smallBlindTag: NegativeTag
        antes: [2]
      - or:
          - joker: OopsAll6s
            antes: [2]
            sources:
              shopItems: [2, 3, 4]
            score: 100
          - joker: OopsAll6s
            antes: [2]
            sources:
              shopItems: [4, 5, 6]
            score: 100
          - joker: OopsAll6s
            antes: [2]
            sources:
              shopItems: [6, 7, 8]
            score: 100
    mode: Max
    score: 100

  # Ante 3 - Same scenario, different mode
  - and:
      - smallBlindTag: NegativeTag
        antes: [3]
      - or:
          - joker: OopsAll6s
            antes: [3]
            sources:
              shopItems: [2, 3, 4]
            score: 100
          - joker: OopsAll6s
            antes: [3]
            sources:
              shopItems: [4, 5, 6]
            score: 100
          - joker: OopsAll6s
            antes: [3]
            sources:
              shopItems: [6, 7, 8]
            score: 100
    mode: Sum
    score: 100
