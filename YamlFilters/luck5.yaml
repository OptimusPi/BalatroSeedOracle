name: luck5
description: testing YAML anchors with full scenario pattern template
author: pifreak & their pal Cursor AI
deck: Anaglyph
stake: White

must:
  - legendaryJoker: Perkeo
    antes: [1, 2, 3, 4, 5, 6, 7, 8]

should:
  - legendaryJoker: Perkeo
    score: 10

  # Ante 2 - Score based on NegativeTag Skip Reward + Desired jokers in shop cluster (anchored)
  - and:
      - smallBlindTag: NegativeTag
        antes: [2]
      - or:
          - joker: &desired_joker OopsAll6s
            sources: &cluster_a
              shopItems: [2, 3, 4]
            antes: [2]
            score: &score_per_joker 100
          - joker: *desired_joker
            sources: &cluster_b
              shopItems: [4, 5, 6]
            antes: [2]
            score: *score_per_joker
          - joker: *desired_joker
            sources: &cluster_c
              shopItems: [6, 7, 8]
            antes: [2]
            score: *score_per_joker
    mode: Max
    score: 100

  # Ante 3 - Reuse the anchored joker, slot clusters, and score with Sum mode
  - and:
      - smallBlindTag: NegativeTag
        antes: [3]
      - or:
          - joker: *desired_joker
            sources: *cluster_a
            antes: [3]
            score: *score_per_joker
          - joker: *desired_joker
            sources: *cluster_b
            antes: [3]
            score: *score_per_joker
          - joker: *desired_joker
            sources: *cluster_c
            antes: [3]
            score: *score_per_joker
    mode: Sum
    score: 100
