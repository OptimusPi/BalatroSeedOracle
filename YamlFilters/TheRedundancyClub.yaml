name: The Redundancy Club
author: Claude (Anthropic) — for pifreak & Jimbo
description: >
  A shrine to wasted joker slots. A seed so useless it's art.

  One Showman gives you permission to own duplicates. Two Showmen is that
  permission recursively permitting itself. Four Fingers doesn't care that
  you own four Four Fingers — you still only need four cards. Shortcut
  still makes one skip even if you own five. Mr. Bones revives ONCE;
  a hoard of Mr. Bones is just polite afterlife networking.

  Higher score = dumber seed. Seeds at the top of this leaderboard are
  unplayable but conceptually stunning. Frame them.

  SIMD fast-path: both Showman AND Four Fingers must appear in antes 1–3
  (uncommon × uncommon is rare enough that non-matches early-exit fast).

dateCreated: 2026-04-23T00:00:00Z
deck: Red
stake: White

must:
  - jokers: [Showman, FourFingers]
    antes: [1, 2, 3]

should:
  - joker: Showman
    label: Showman (recursive permission)
    antes: [1, 2, 3, 4, 5, 6]
    score: 200

  - joker: FourFingers
    label: Four Fingers (still four cards)
    antes: [1, 2, 3, 4, 5, 6]
    score: 80

  - joker: Shortcut
    label: Shortcut (one skip either way)
    antes: [1, 2, 3, 4, 5, 6]
    score: 70

  - joker: SmearedJoker
    label: Smeared (suits merge once)
    antes: [1, 2, 3, 4, 5, 6]
    score: 60

  - joker: CreditCard
    label: Credit Card (matching wallet)
    antes: [1, 2, 3, 4, 5, 6]
    score: 50

  - joker: MrBones
    label: Mr. Bones (afterlife hoarder)
    antes: [1, 2, 3, 4, 5, 6]
    score: 50

  - joker: Astronomer
    label: Astronomer (free packs^n = free packs)
    antes: [1, 2, 3, 4, 5, 6]
    score: 40

  - smallBlindTag: NegativeTag
    label: Negative Tag (so the joke lives forever)
    antes: [1, 2, 3, 4, 5, 6]
    score: 30

mustNot: []
