name: Diet Cola Negative Farm
author: for pi and Lola — beat the 60. Anaglyph doubles every boss tag; Diet Cola sells for a free Double Tag; Double Tags copy Negative Tags. Stack the loop, count the negatives.
description: >
  The Negative Tag farm engine. Anaglyph deck (Double Tag each boss) + Diet Cola
  early (sell for another Double Tag) + a heavy Negative Tag supply across every
  blind. Must: Diet Cola by ante 3 and at least a couple early Negative Tags to
  seed the loop. Should: every Negative Tag on every blind, scored hard, so the
  top seed is the one with the most negatives to copy.
deck: Anaglyph
stake: White

must:
  - joker: DietCola
    antes: [1,2,3]
  - smallBlindTag: NegativeTag
    antes: [1,2,3,4,5,6,7,8]
    min: 2

